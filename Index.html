<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Motivasi Harian</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #f0f2f5; 
            color: #333;
            padding: 40px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 25px;
            color: #1a1a1a;
            font-weight: 700;
        }
        form { 
            background: white; 
            width: 100%;
            max-width: 450px; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.05); 
            margin-bottom: 30px;
        }
        form h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #555;
        }
        textarea { 
            width: 100%; 
            height: 100px;
            margin-bottom: 15px; 
            padding: 12px; 
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border 0.2s;
        }
        textarea:focus {
            border-color: #007bff;
        }
        input[type="file"] { 
            width: 100%; 
            margin-bottom: 20px; 
            padding: 10px; 
            background: #f8f9fa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            cursor: pointer;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            width: 100%;
            padding: 12px; 
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer; 
            border-radius: 8px; 
            transition: background 0.2s;
        }
        button:hover {
            background: #0056b3;
        }
        #container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.05); 
            overflow: hidden;
            position: relative;
        }
        .card p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 15px;
            color: #222;
        }
        img { 
            width: 100%; 
            height: auto; 
            border-radius: 10px; 
            display: block;
            object-fit: cover;
            margin-bottom: 15px;
        }
        /* Style Tambahan untuk Tombol Hapus */
        .btn-hapus {
            background: #dc3545;
            padding: 8px;
            font-size: 0.9rem;
        }
        .btn-hapus:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

    <h1>Ruang Motivasi</h1>

    <form id="motivasiForm">
        <h3>Tambah Motivasi Baru</h3>
        <textarea id="textInput" placeholder="Tulis kata motivasi..." required></textarea><br>
        <input type="file" id="imageInput" accept="image/*" required><br>
        <button type="submit">Simpan Motivasi</button>
    </form>

    <div id="container"></div>

    <!-- Menghubungkan ke file script.js eksternal -->
    <script src="script.js"></script>
</body>
</html>
